<!doctype html><html lang="ja"><meta charset="utf-8"><title>6〜10階 水の遺跡</title>
<style>body{margin:16px;background:#132a31;color:#e6f0ed;font:15px system-ui}h1{font-size:24px}button{padding:9px;margin:0 6px 8px 0;background:#254751;color:#e6f0ed;border:1px solid #648788;border-radius:5px;cursor:pointer}iframe{width:1000px;height:650px;border:1px solid #648788;display:block}output{display:block;margin:8px 0}pre{white-space:pre-wrap}a{color:#a6ddd5}</style>
<h1>6〜10階・水の遺跡</h1><p>低い石壁、湿った石畳、苔と浅い水たまり。各階の置物を通常エリアと中ボス部屋に配置。</p>
<nav><button data-floor="6">6階・地下水路</button><button data-floor="7">7階・根の遺跡</button><button data-floor="8">8階・魔術神殿</button><button data-floor="9">9階・沈んだ砦</button><button data-floor="10">10階・大水門</button></nav>
<button id="overview">部屋全体</button><button id="arena">専用ボス部屋</button><button id="field">中ボス部屋</button><a id="play" target="_blank">この階を遊ぶ</a>
<output>読み込み中</output><iframe title="水系マップの確認用ゲーム"></iframe><pre></pre>
<script type="module">
import {WATER_TITLES,WATER_PARTS,waterTerrainKey} from '/src/waterTerrain.ts';
if(location.hostname!=='localhost')throw Error('Local QA only');
const iframe=document.querySelector('iframe'),out=document.querySelector('output'),report=document.querySelector('pre');let floor=6,ready=false,arena=false;
const scene=()=>iframe.contentWindow?.__game?.scene.getScene('GameScene');
function load(n,boss=n===10){floor=n;arena=boss;ready=false;out.textContent='読み込み中';report.textContent='';const url=`/?qa-game&qa-floor=${n}&qa-field-arena${boss?'&qa-boss':''}`;iframe.src=url;document.querySelector('#play').href=url;}
for(const b of document.querySelectorAll('[data-floor]'))b.onclick=()=>load(Number(b.dataset.floor));
document.querySelector('#arena').onclick=()=>load(floor,true);
document.querySelector('#field').onclick=()=>load(floor,false);
document.querySelector('#overview').onclick=()=>{if(!ready)return;const g=scene(),r=g.dungeon.bossRoom,c=g.cameras.main;c.stopFollow();c.setZoom(Math.min(c.width/((r.w+6)*32),c.height/((r.h+6)*32)));c.centerOn((r.cx+.5)*32,(r.cy+.5)*32);};
setInterval(()=>{const g=scene();if(ready||!g?.playerSprite||!g.sys.isActive()||g.floor!==floor)return;const b=g.enemies.find(e=>e.def.isFloorBoss);if(!b)return;
g.input.enabled=false;g.scene.get('UIScene').input.enabled=false;g.scene.get('UIScene').setOverlay('none');
const r=g.dungeon.bossRoom,inside=p=>p.x>=r.x&&p.x<r.x+r.w&&p.y>=r.y&&p.y<r.y+r.h;
const props=arena?g.dungeon.waterArena?.props:g.dungeonObjects.filter(inside);
const frames=new Set(),keys=new Set();for(let y=r.y;y<r.y+r.h;y++)for(let x=r.x;x<r.x+r.w;x++){if(g.dungeon.tiles[y][x]!=='floor')continue;const v=g.tileVisual('floor',1,x,y);keys.add(v.key);frames.add(v.frame);}
const missing=[...WATER_PARTS,'floor'].filter(p=>!g.textures.exists(waterTerrainKey(floor,p)));
const wall=g.tileVisual('wall',1,r.x-1,r.cy).key;
const pass=!missing.length&&props?.length>=6&&g.wallFacades.length===0&&keys.has(waterTerrainKey(floor,'floor'))&&wall.startsWith(`terrain_water_${floor}_wall`);
out.textContent=(pass?'PASS':'FAIL')+`：${floor}階・${WATER_TITLES[floor-6]}`;
report.textContent=JSON.stringify({floor,arena,boss:b.def.name,props:props?.length,wall,floorFrames:[...frames],missing,wallFacades:g.wallFacades.length,fps:Math.round(g.game.loop.actualFps),room:r},null,2);ready=true;
},100);load(6);
</script></html>
