<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<title>15階・氷晶の広間を確認</title>
<style>body{margin:16px;background:#10232e;color:#dcf5ff;font:15px system-ui}button,a{margin:0 12px 10px 0;padding:8px;color:inherit}button{background:#22475a;border:1px solid #6babc4}iframe{width:1000px;height:650px;border:1px solid #38718d}pre{white-space:pre-wrap}</style>
<h1>15階・氷晶の広間</h1>
<button id="overview">部屋全体</button><button id="combat">通常の戦闘表示</button>
<a href="/?qa-game&qa-floor=15&qa-boss&qa-field-arena">ゲームで開く</a>
<output>読み込み中</output>
<iframe title="氷のボス部屋"></iframe>
<pre></pre>
<script type="module">
const frame=document.querySelector('iframe'),output=document.querySelector('output'),report=document.querySelector('pre');
if(location.hostname!=='localhost')throw new Error('Local QA only');
const scene=()=>frame.contentWindow?.__game?.scene.getScene('GameScene');
function overview(){const gs=scene(),r=gs.dungeon.bossRoom,c=gs.cameras.main;c.stopFollow();c.setZoom(Math.min(c.width/((r.w+3)*32),c.height/((r.h+3)*32)));c.centerOn((r.cx+.5)*32,(r.cy+.5)*32);}
document.querySelector('#overview').onclick=overview;
document.querySelector('#combat').onclick=()=>{const gs=scene();gs.cameras.main.setZoom(1.95).startFollow(gs.playerSprite,false,.15,.15);};
frame.src='/?qa-game&qa-floor=15&qa-boss&qa-field-arena';
const timer=setInterval(()=>{
  const gs=scene();if(!gs?.playerSprite||!gs.sys.isActive()||!gs.dungeon.glacialArena)return;
  clearInterval(timer);overview();
  const d=gs.dungeon,boss=gs.enemies.find(e=>e.def.isFloorBoss);
  const props=d.glacialArena.props;
  const textureKeys=['floor','wall','crystal','obelisk','boulder','altar'].map(n=>'terrain_glacial_'+n);
  const loaded=textureKeys.every(k=>gs.textures.exists(k));
  const pass=loaded&&boss?.def.key==='m_ice_behemoth'&&gs.bossRoomDecorSprites.length===props.length+1;
  output.textContent=pass?'PASS：氷の部屋・ボス・オブジェを表示':'FAIL';
  report.textContent=JSON.stringify({boss:boss?.def.name,texture:boss?.sprite.texture.key,biome:d.biome,room:d.bossRoom,props:props.map(p=>({...p,tile:d.tiles[p.y][p.x]})),loaded},null,2);
},100);
</script>
</html>
