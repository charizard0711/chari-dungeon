<!doctype html><html lang="ja"><meta charset="utf-8"><title>秘密クエストと伝説のオーラ</title>
<style>body{margin:16px;background:#0d1520;color:#e9dfd0;font:14px system-ui}h1{font-size:23px;margin:5px 0}p{color:#b4a6bf;margin:8px 0}button,select{background:#2a293e;color:#f2e1ba;border:1px solid #6d607a;padding:8px 11px;margin:3px;border-radius:4px;cursor:pointer}iframe{display:block;width:1280px;max-width:100%;height:800px;border:1px solid #977745;margin-top:10px}output{display:block;color:#9ed9c7;min-height:22px;margin-top:8px}pre{font:11px monospace;white-space:pre-wrap}.gallery{display:flex;gap:16px;flex-wrap:wrap}.gallery figure{margin:0;background:#192430;padding:20px;text-align:center}.gallery img{height:170px;width:145px;object-fit:contain}details{max-width:1280px}</style>
<h1>秘密クエスト / 伝説のオーラ / 新しいスキル演出</h1>
<p>ローカル確認用。実際の冒険セーブ・秘密クエストの手帳は変更しません。</p>
<nav><button id="legend">最強装備のオーラ</button><button id="sworddetail">剣のオーラ拡大</button><button id="shielddetail">盾のオーラ拡大</button><button id="hidden">未解読の手帳</button><button id="reveal">5枚目で解読</button><button id="complete">1件目を達成</button><button id="completeall">5件目を達成</button><button id="rewards">報酬5種類を見る</button><button id="claim">報酬を受け取る</button><button id="full">所持上限で受け取る</button><button id="resume">セーブを読み戻す</button></nav>
<nav><label>スキル <select id="skill"></select></label><label>向き <select id="direction"><option value="right">右</option><option value="down">下</option><option value="left">左</option><option value="up">上</option></select></label><button id="cast">スキル発動</button><button id="slow">スキルをスロー再生</button><button id="allskills">全スキル・4方向を検証</button><button id="ending">エンディング</button><button id="mobile">スマホ</button><button id="desktop">PC</button></nav>
<output>読み込み中</output><iframe title="秘密クエスト確認画面"></iframe><details><summary>動作確認結果</summary><pre></pre></details>
<h2>新しい5つの秘宝</h2><div class="gallery"></div>
<script type="module">
import {ITEM_CATALOG} from '/src/itemCatalog.ts';
import {WEAPON_DEFS,MONSTER_DEFS} from '/src/data.ts';
import {makeWeapon,makeShield} from '/src/player.ts';
import {SECRET_QUESTS,SECRET_WEAPON_KEYS,normalizeQuests,recordQuestKill,canClaimQuest,QUEST_SAVE_KEY} from '/src/secretQuests.ts';
import {WEAPON_SKILLS,directionVector} from '/src/weaponSkills.ts';
import {ADVENTURE_ART} from '/src/adventureArt.ts';
if(location.hostname!=='localhost')throw Error('Local QA only');
const frame=document.querySelector('iframe'),report=document.querySelector('pre'),output=document.querySelector('output');
const g=()=>frame.contentWindow?.__game?.scene.getScene('GameScene'),u=()=>g().scene.get('UIScene');
const before=localStorage.getItem(QUEST_SAVE_KEY); let ready=false,phone=false,latest={},origin;
for(const[key,s]of Object.entries(WEAPON_SKILLS)){const o=document.createElement('option');o.value=key;o.textContent=s.name;document.querySelector('#skill').append(o);}
for(const key of SECRET_WEAPON_KEYS){const f=document.createElement('figure');f.innerHTML=`<img src="/${ADVENTURE_ART[key]}" alt=""><figcaption>${WEAPON_DEFS.find(d=>d.key===key).name}</figcaption>`;document.querySelector('.gallery').append(f);}
function load(mobile=false){phone=mobile;ready=false;latest={};frame.style.width=mobile?'390px':'1280px';frame.style.height=mobile?'860px':'800px';frame.src='/?qa-silent&qa-game&qa-floor=5&qa-boss&qa-field-arena&mobile='+(mobile?1:0);}
function close(){u().setOverlay('none');}
function equipLegend(){const s=g();close();s.clearTransformation();s.player.weapon=makeWeapon('w_hero_sword',[]);s.player.shield=makeShield('s_arcadia_guard');s.player.weapons=[s.player.weapon];s.player.shields=[s.player.shield];s.setPlayerVisual('down','idle');s.emitRefresh();}
function hidden(){const s=g();s.secretQuests=normalizeQuests();u().secretRewardOpen=false;u().setOverlay('quests');}
function reveal(){const s=g();s.secretQuests=normalizeQuests({fragments:4});const result=recordQuestKill(s.secretQuests,'m_slime',()=>0);s.events.emit('quest-notice',{title:'秘密が、いま明かされる',detail:'5枚の切れ端を解読。秘密クエストが開放されました。'});u().setOverlay('quests');latest={reveal:result,fragments:s.secretQuests.fragments};}
function complete(all=false){const s=g();close();s.secretQuests=normalizeQuests({fragments:5,kills:all?{lantern:19,owl:20,clockwork:20,iron:20,eye:20}:{lantern:19}});const def=MONSTER_DEFS.find(d=>d.key==='m_mush');s.addEnemy({...def,gold:0,exp:0,score:0},s.player.x+1,s.player.y,1);const e=s.enemies.at(-1);e.hp=0;s.killEnemy(e,0);s.emitRefresh();u().secretRewardOpen=false;u().setOverlay('quests');latest={completed:s.secretQuests.kills.lantern,announced:s.secretQuests.announced};}
function rewards(){const s=g();s.secretQuests=normalizeQuests({fragments:5,kills:Object.fromEntries(SECRET_QUESTS.map(q=>[q.id,q.count]))});u().secretRewardOpen=true;u().setOverlay('quests');}
for(const [button,key] of [['sworddetail','w_hero_sword'],['shielddetail','s_arcadia_guard']])document.querySelector('#'+button).onclick=()=>{g().discoveredEquipment.add(key);u().setOverlay('equipmentcatalog');u().selectCatalogItem(ITEM_CATALOG.find(e=>e.key===key));};
document.querySelector('#legend').onclick=equipLegend;document.querySelector('#hidden').onclick=hidden;document.querySelector('#reveal').onclick=reveal;document.querySelector('#complete').onclick=()=>complete();document.querySelector('#completeall').onclick=()=>complete(true);document.querySelector('#rewards').onclick=rewards;
document.querySelector('#claim').onclick=()=>{const s=g(),first=s.claimSecretQuest(SECRET_WEAPON_KEYS[0]),second=s.claimSecretQuest(SECRET_WEAPON_KEYS[0]);latest={firstClaim:first,duplicateRejected:!second,weaponCount:s.player.weapons.filter(w=>w.key===SECRET_WEAPON_KEYS[0]).length};u().secretRewardOpen=false;u().setOverlay('quests');};
document.querySelector('#full').onclick=()=>{const s=g();s.player.weapons=Array.from({length:12},()=>makeWeapon('w_soldier_blade',[]));s.secretQuests=normalizeQuests({fragments:5,kills:Object.fromEntries(SECRET_QUESTS.map(q=>[q.id,q.count]))});s.pendingEquipment=null;const first=s.claimSecretQuest(SECRET_WEAPON_KEYS[1]),second=s.claimSecretQuest(SECRET_WEAPON_KEYS[2]);latest={fullAccepted:first,secondBlocked:!second,pending:s.pendingEquipment?.item.key};};
document.querySelector('#resume').onclick=()=>{const s=g(),saved=JSON.parse(JSON.stringify(s.captureRun()));s.buildFloor(saved.state.floor,saved.state.inBossRoom,saved);s.emitRefresh();latest={restoredFragments:s.secretQuests.fragments,claimed:s.secretQuests.claimed,pending:s.pendingEquipment?.item.key};};
async function cast(slow=false){const s=g();if(s.busy||s.pendingEquipment)return;close();s.player.x=origin.x;s.player.y=origin.y;s.placeSprite(s.playerSprite,origin.x,origin.y);for(const e of s.enemies){e.sprite.destroy();e.shadow?.destroy();e.hpBar?.destroy();}s.enemies=[];
 const type=document.querySelector('#skill').value,dir=document.querySelector('#direction').value,d=directionVector(dir);s.player.weapon=makeWeapon(WEAPON_DEFS.find(w=>w.weaponType===type).key,[]);s.player.shield=null;s.setPlayerVisual(dir,'idle');s.skillChargeSteps=100;
 const distance=type==='dagger'?3:['longsword','greatsword'].includes(type)?1:2;const def=MONSTER_DEFS.find(d=>d.key==='m_mush');s.addEnemy({...def,hpMin:5000,hpMax:5000,atkMin:0,atkMax:0},origin.x+d.x*distance,origin.y+d.y*distance,1);s.enemies.at(-1).hp=s.enemies.at(-1).hpMax=5000;
 s.updateVisibility();s.emitRefresh();s.tweens.timeScale=slow?.12:1;s.time.timeScale=slow?.12:1;latest={skill:type,started:true};const ok=await s.useWeaponSkill();latest={skill:type,success:ok,charge:s.skillChargeSteps,enemyHp:s.enemies[0]?.hp,effectsRemaining:s.children.list.filter(c=>c.name==='painted-skill-fx').length};s.tweens.timeScale=1;s.time.timeScale=1;}
document.querySelector('#cast').onclick=()=>cast();document.querySelector('#slow').onclick=()=>cast(true);
document.querySelector('#allskills').onclick=async()=>{const results=[];for(const type of Object.keys(WEAPON_SKILLS))for(const dir of ['right','down','left','up']){document.querySelector('#skill').value=type;document.querySelector('#direction').value=dir;await cast();await new Promise(r=>setTimeout(r,650));const s=g(),remaining=s.children.list.filter(c=>c.name==='painted-skill-fx').length;results.push({type,dir,success:latest.success,hp:latest.enemyHp,effects:remaining,pass:latest.success&&latest.enemyHp<5000&&remaining===0});}latest={suite:results,allSkillsPass:results.every(r=>r.pass)};};
document.querySelector('#ending').onclick=()=>{const s=g();s.scene.stop('UIScene');s.scene.start('EndScene',{cleared:true,floor:30,level:26,gold:12480,score:48750,turns:1862,hp:112,hpMax:256,discovered:48,totalMonsters:74});};
document.querySelector('#mobile').onclick=()=>load(true);document.querySelector('#desktop').onclick=()=>load();
setInterval(()=>{const s=g();if(!s?.playerSprite||!s.sys.isActive())return;
 if(!ready){s.lightRadius=100;s.player.hp=s.player.hpMax=5000;s.player.gold=10000;const room=s.dungeon.bossRoom;origin={x:room.cx-2,y:room.cy-2};s.player.x=origin.x;s.player.y=origin.y;s.placeSprite(s.playerSprite,origin.x,origin.y);for(const e of s.enemies){e.sprite.destroy();e.shadow?.destroy();e.hpBar?.destroy();}s.enemies=[];s.cameras.main.stopFollow();s.cameras.main.setZoom(phone?1.6:2.5);s.cameras.main.centerOn((origin.x+1.5)*32,(origin.y+.5)*32);s.updateVisibility();equipLegend();ready=true;}
 const state={...latest,rewardReady:canClaimQuest(s.secretQuests),mode:phone?'mobile':'PC',fragments:s.secretQuests.fragments,kills:s.secretQuests.kills,claimed:s.secretQuests.claimed,overlay:u().overlayMode,pending:s.pendingEquipment?.item.key,shield:s.player.shield?.name,allArtLoaded:Object.keys(ADVENTURE_ART).every(k=>s.textures.exists(k)),realJournalUntouched:localStorage.getItem(QUEST_SAVE_KEY)===before,effectsRemaining:s.children.list.filter(c=>c.name==='painted-skill-fx').length};report.textContent=JSON.stringify(state,null,2);output.textContent=`${state.allArtLoaded&&state.realJournalUntouched?'PASS':'FAIL'}：新規素材15枚 ／ ${state.mode} ／ 手がかり ${state.fragments}/5 ／ ${state.overlay} ／ ${latest.skill?'スキル '+latest.skill:''}`;
},250);load();
</script></html>
