<!doctype html>
<html lang="ja"><meta charset="utf-8"><title>ボス部屋の外周攻撃確認</title>
<style>body{margin:16px;background:#111923;color:#ece1ca;font:14px system-ui}h1{font-size:22px}button,select{padding:7px 12px;margin:4px;background:#292a38;color:#ffe1a2;border:1px solid #8d764a}iframe{display:block;width:1100px;max-width:100%;height:680px;border:1px solid #8d764a;margin-top:12px}output{display:block;margin:10px 0;color:#a9dbb5}pre{white-space:pre-wrap}</style>
<h1>ボス部屋の外周攻撃確認</h1><p>ローカル専用。実際の冒険セーブ・手帳は変更しません。</p>
<label>階層 <select id="floor"><option value="3">3階・氷竜</option><option value="26">26階・クラーケン</option><option value="30">30階・竜皇</option></select></label>
<button id="west">西の端に予告</button><button id="east">東の端に予告</button><button id="north">北の端に予告</button><button id="south">南の端に予告</button><button id="resolve">その場で攻撃を受ける</button>
<output>読み込み中</output><iframe title="外周攻撃の確認画面"></iframe><pre></pre>
<script type="module">
if(location.hostname!=='localhost')throw Error('Local QA only');
const frame=document.querySelector('iframe'),output=document.querySelector('output'),report=document.querySelector('pre');
let ready=false,floor=3,boss,state,intent;
const game=()=>frame.contentWindow?.__game?.scene.getScene('GameScene');
function load(){ready=false;intent=null;floor=Number(document.querySelector('#floor').value);frame.src=`/?qa-silent&qa-game&qa-field-arena&qa-floor=${floor}${floor===30?'&qa-boss':''}&mobile=0`;output.textContent='読み込み中';}
function preview(edge){
 const s=game(),r=s.dungeon.bossRoom;if(!ready)return;
 if(intent)for(const m of intent.markers)s.destroyBossWarningMarker(m);
 const candidates=[];for(let y=r.y;y<r.y+r.h;y++)for(let x=r.x;x<r.x+r.w;x++){
  const onEdge=edge==='west'?x===r.x:edge==='east'?x===r.x+r.w-1:edge==='north'?y===r.y:y===r.y+r.h-1;
  if(onEdge&&s.validBossTile(x,y)&&!s.enemyAt(x,y)&&!s.chestAt(x,y))candidates.push({x,y});
 }
 candidates.sort((a,b)=>(Math.abs(a.x-r.cx)+Math.abs(a.y-r.cy))-(Math.abs(b.x-r.cx)+Math.abs(b.y-r.cy)));
 const p=candidates[0];if(!p){output.textContent='この辺は壁です';return;}
 s.player.x=p.x;s.player.y=p.y;s.placeSprite(s.playerSprite,p.x,p.y);s.player.hp=s.player.hpMax=5000;s.player.shield=null;s.player.weapon=null;s.emitRefresh();s.updateVisibility();
 state.phase=floor===26?1:0;state.phaseTwo=false;state.stunned=0;state.cooldown=0;
 intent=s.prepareBossIntent(boss,state);
 const target=intent?.markers.some(m=>m.x===p.x&&m.y===p.y);
 output.textContent=(target?'PASS':'FAIL')+'：端のプレイヤー位置まで予告あり';
 report.textContent=JSON.stringify({floor,edge,player:p,attackIncludesPlayer:target,labels:intent?.markers.filter(m=>m.x===p.x&&m.y===p.y).map(m=>m.label.text)},null,2);
}
for(const edge of ['west','east','north','south'])document.querySelector('#'+edge).onclick=()=>preview(edge);
document.querySelector('#floor').onchange=load;
document.querySelector('#resolve').onclick=async()=>{
 const s=game();if(!ready||!intent)return;const hp=s.player.hp;
 while(intent.markers.length){const result=s.resolveBossIntent(boss,state,intent);await result.animation;}
 output.textContent=(s.player.hp<hp?'PASS':'FAIL')+`：外周でも命中（${hp-s.player.hp}ダメージ）`;intent=null;s.emitRefresh();
};
setInterval(()=>{
 const s=game();if(ready||!s?.playerSprite||!s.sys.isActive()||s.floor!==floor)return;
 boss=s.enemies.find(e=>e.def.isFloorBoss);state=s.bossStates.get(boss);if(!state)return;
 s.lightRadius=100;s.setBossEntranceClosed(true,false);s.scene.get('UIScene').setOverlay('none');
 const r=s.dungeon.bossRoom,c=s.cameras.main;c.stopFollow();c.setZoom(Math.min(1.7,c.width/((r.w+2)*32),c.height/((r.h+2)*32)));c.centerOn((r.x+r.w/2)*32,(r.y+r.h/2)*32);
 ready=true;preview('west');
},100);
load();
</script></html>
