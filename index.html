<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/sword-blue-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./icons/sword-blue-16.png" />
    <link rel="shortcut icon" href="./icons/sword-blue.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/sword-blue-180.png" />
    <script defer src="./analytics.js"></script>
    <title>Chari Dungeon</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="loading-screen" data-mode="boot" aria-label="ゲームを読み込み中">
      <h1 class="loading-title">Chari Dungeon</h1>
      <div class="loading-sparks" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div class="loading-card">
        <div class="loading-walk" aria-hidden="true"><div class="loading-adventurer"></div><div class="loading-ground"></div></div>
        <h1 class="loading-boot-title">Chari Dungeon</h1>
        <h2>ダンジョンの扉を開いています…</h2>
        <div class="loading-track" role="progressbar" aria-label="読み込み状況" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="loading-fill"></div></div>
        <p class="loading-percent">0%</p>
        <p class="loading-status" role="status">ダンジョンを読み込み中…</p>
        <p class="loading-tip">お金がたまったら、ガチャで装備を整えよう。</p>
      </div>
    </div>
    <div id="app">
      <div id="game-container"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
